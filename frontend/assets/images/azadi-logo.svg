<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="100%" height="100%" fill="none">
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="dot-gradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </radialGradient>
  </defs>

  <style>
    @keyframes drawLetters {
      0% { opacity: 0; transform: translateY(6px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseDot {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes rippleWave {
      0% { r: 12px; opacity: 0.8; stroke-width: 2.5px; }
      100% { r: 28px; opacity: 0; stroke-width: 0.5px; }
    }
    .wordmark {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 82px;
      fill: #18202A;
      letter-spacing: -3.5px;
      transform-origin: center;
      animation: drawLetters 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .signal-pulse {
      transform-origin: 304px 34px;
      animation: pulseDot 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
      opacity: 0;
    }
    .signal-ripple {
      transform-origin: 304px 34px;
      animation: rippleWave 1.6s ease-out 0.8s infinite;
      stroke: #D32F2F;
    }
  </style>

  <!-- Animated Wordmark -->
  <text x="18" y="86" class="wordmark">azadi</text>

  <!-- Glowing Radar Ripple around live dot -->
  <circle cx="304" cy="34" r="14" class="signal-ripple" fill="none" />

  <!-- Iconic Vibrant Red Signal Dot -->
  <g class="signal-pulse">
    <circle cx="304" cy="34" r="14" fill="url(#dot-gradient)" filter="url(#subtle-glow)" />
    <circle cx="301" cy="31" r="3.5" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
